; X64.51 experiment E1 (synthetic, test stages only; NOT game data): an America skirmish build list whose second Barracks slot is AutomaticallyBuild = Yes.
; Retail scripts mark the FIRST unbuilt Barracks slot as priority; the second slot is never marked, so only the automatic path can build it.
; Positions are relative to the Command Center slot (adjustBuildList translates the whole list around the start Command Center).
AIData
  SkirmishBuildList America
    Structure AmericaCommandCenter
      Location = X:500.0 Y:500.0
      Rebuilds = 0
      Angle = -135.00
      InitiallyBuilt = No
      AutomaticallyBuild = Yes
    END
    Structure AmericaPowerPlant
      Location = X:620.0 Y:420.0
      Rebuilds = 0
      Angle = -45.00
      InitiallyBuilt = No
      AutomaticallyBuild = No
    END
    Structure AmericaBarracks
      Location = X:380.0 Y:620.0
      Rebuilds = 0
      Angle = 45.00
      InitiallyBuilt = No
      AutomaticallyBuild = No
    END
    Structure AmericaBarracks
      Location = X:560.0 Y:660.0
      Rebuilds = 0
      Angle = 45.00
      InitiallyBuilt = No
      AutomaticallyBuild = Yes
    END
  End
End
